name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-cli:
    name: CLI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build ogrl CLI
        run: cargo build --release --locked --bin ogrl --target ${{ matrix.target }}
      - name: Package archive
        shell: bash
        run: |
          mkdir -p dist
          tar -czf "dist/ogrl-${{ matrix.target }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" ogrl
          (cd dist && shasum -a 256 "ogrl-${{ matrix.target }}.tar.gz" > "ogrl-${{ matrix.target }}.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: dist/*

  build-wheels:
    name: Python wheels (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            manylinux: auto
          - os: ubuntu-latest
            target: x86_64
            manylinux: 2_28
          - os: ubuntu-24.04-arm
            target: aarch64
            manylinux: 2_28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build abi3-py313 wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/ogrl-py
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: ${{ matrix.manylinux }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: crates/ogrl-py/dist/*.whl

  publish:
    name: Publish GitHub Release
    needs: [build-cli, build-wheels]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
