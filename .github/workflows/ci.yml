name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check Python package version is dynamic from Cargo
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path

          text = Path("crates/ogrl-py/pyproject.toml").read_text()
          if 'dynamic = ["version"]' not in text and "dynamic = ['version']" not in text:
              print("Error: crates/ogrl-py/pyproject.toml must use dynamic = [\"version\"] so the wheel follows the Cargo workspace version", file=sys.stderr)
              sys.exit(1)
          # A static project version would silently diverge from Cargo again.
          in_project = False
          for raw in text.splitlines():
              line = raw.strip()
              if line.startswith("[") and line.endswith("]"):
                  in_project = line == "[project]"
                  continue
              if in_project and line.startswith("version"):
                  print(f"Error: crates/ogrl-py/pyproject.toml has a static {line}; use dynamic = [\"version\"] instead", file=sys.stderr)
                  sys.exit(1)
          print("ok: pyproject.toml takes its version from the Cargo workspace")
          PY
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy (workspace + ogrl-py)
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy -p ogrl-py --features extension-module -- -D warnings
      - name: Test workspace
        run: cargo test --locked

  python:
    name: Python bindings (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Create venv & install maturin/pytest
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip maturin pytest
      - name: Build and install ogrl-py
        run: VIRTUAL_ENV="$PWD/.venv" .venv/bin/maturin develop --release --manifest-path crates/ogrl-py/Cargo.toml
      - name: Run Python binding tests
        run: .venv/bin/pytest -v crates/ogrl-py/tests
