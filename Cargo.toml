[workspace]
resolver = "2"
members = [
    "crates/ogrl-core",
    "crates/ogrl-oscal",
    "crates/ogrl-cli",
    "crates/ogrl-py",
]
default-members = [
    "crates/ogrl-core",
    "crates/ogrl-oscal",
    "crates/ogrl-cli",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/adversitydotdev/ogrl-rs"
description = "High-performance Rust parser, linter, formatter, evaluator, and OSCAL bridge for OGRL (Open Governance Reference Language)."

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
csv = "1"
hex = "0.4"
pyo3 = { version = "0.27", features = ["abi3-py313"] }
quick-xml = "0.37"
rayon = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
ureq = "2"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
walkdir = "2"
yaml-rust2 = "0.10"

[workspace.lints.clippy]
collapsible_if = "allow"

[profile.release]
lto = "thin"
strip = "debuginfo"


